[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-agent"
version = "0.1.0"
description = "Overview-aligned cardiac evidence pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10", "pydantic>=2.7,<3", "httpx>=0.27,<1", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
segmentation = ["torch>=2.6", "torchvision>=0.21"]
flow = ["opencv-python-headless>=4.10"]
medical_io = ["SimpleITK>=2.3"]

[project.scripts]
cardiac-agent = "cardiac_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
